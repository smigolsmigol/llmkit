name: Update Pricing

on:
  schedule:
    - cron: '17 6 * * 0' # weekly, Sunday 06:17 UTC
  workflow_dispatch:

concurrency:
  group: update-pricing
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLMKIT_QUALITY_PYTHON: ${{ github.workspace }}/.venv/bin/python
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: bootstrap pinned Python formatter
        run: corepack pnpm@9.15.4 quality:bootstrap

      - name: fetch latest pricing
        run: node scripts/fetch-pricing.mjs

      - name: build and verify
        run: |
          pnpm turbo build --filter=@f3d1/llmkit-shared --filter=@f3d1/llmkit-mcp-server
          node scripts/generate-pricing.mjs --check
          node test/contract-test.mjs
          node packages/proxy/test/xai-cost-test.mjs
          node packages/proxy/test/unit-test.mjs
          node packages/shared/test/exports-test.mjs

      - name: check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            MODELS=$(node -e "const p=require('./packages/shared/pricing.json');console.log(Object.values(p.providers).reduce((s,m)=>s+Object.keys(m).length,0))")
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "models=$MODELS" >> "$GITHUB_OUTPUT"
          fi

      - name: create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="pricing-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add packages/shared/pricing.json packages/shared/src/pricing-data.ts packages/python-sdk/src/llmkit/_pricing_data.py packages/mcp-server/src/pricing-data.ts
          git commit -m "pricing: scheduled update (${{ steps.diff.outputs.models }} models)"
          git push origin "$BRANCH"
          gh pr create \
            --title "pricing: scheduled update (${{ steps.diff.outputs.models }} models)" \
            --body "Auto-generated by fetch-pricing.mjs from genai-prices + LiteLLM." \
            --label "automated"

      - name: alert on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram failure alert is not configured; skipping delivery."
            exit 0
          fi
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=Pricing update workflow FAILED" > /dev/null
