name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g. shared, sdk, cli, mcp-server, ai-sdk-provider)'
        required: true
        type: choice
        options:
          - shared
          - sdk
          - cli
          - mcp-server
          - ai-sdk-provider

permissions:
  contents: read
  id-token: write # required for npm provenance (Sigstore OIDC)
  attestations: write # required for GitHub artifact attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm turbo build --filter=@f3d1/llmkit-${{ inputs.package }}

      - name: pack tarball
        run: cd packages/${{ inputs.package }} && pnpm pack --pack-destination /tmp/pkg

      - name: attest artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/pkg/*.tgz

      - name: publish with provenance
        run: npm publish /tmp/pkg/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=npm publish FAILED for ${{ inputs.package }}" > /dev/null
