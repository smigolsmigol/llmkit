name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g. shared, sdk, cli, mcp-server, ai-sdk-provider)'
        required: true
        type: choice
        options:
          - shared
          - sdk
          - cli
          - mcp-server
          - ai-sdk-provider
      expected_sha:
        description: 'Full commit SHA this publication is authorized to release'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for npm provenance (Sigstore OIDC)
  attestations: write # required for GitHub artifact attestation

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: verify expected commit
        run: >-
          node scripts/assert-unpublished-version.mjs expected-sha
          "${{ inputs.expected_sha }}"
          "${{ github.sha }}"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: read release metadata
        id: release
        env:
          PACKAGE_DIR: ${{ inputs.package }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';

          const directory = process.env.PACKAGE_DIR;
          if (!/^[a-z0-9-]+$/.test(directory)) throw new Error('Invalid package directory.');
          const manifest = JSON.parse(await readFile(`packages/${directory}/package.json`, 'utf8'));
          console.log(`name=${manifest.name}`);
          console.log(`version=${manifest.version}`);
          NODE

      - name: refuse an existing registry version
        run: >-
          node scripts/assert-unpublished-version.mjs npm
          "${{ steps.release.outputs.name }}"
          "${{ steps.release.outputs.version }}"

      - name: verify source contracts
        run: |
          pnpm test
          pnpm typecheck

      - name: build
        run: pnpm turbo build --filter=@f3d1/llmkit-${{ inputs.package }}

      - name: build MCPB artifact
        if: inputs.package == 'mcp-server'
        run: pnpm mcpb:build

      - name: pack tarball
        run: cd packages/${{ inputs.package }} && pnpm pack --pack-destination /tmp/pkg

      - name: verify packed artifact
        env:
          PACKAGE_DIR: ${{ inputs.package }}
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p /tmp/pkg-check
          tar -xzf /tmp/pkg/*.tgz -C /tmp/pkg-check
          pnpm exec publint /tmp/pkg-check/package
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { assertPublishedVersion } from './scripts/assert-unpublished-version.mjs';

          const packed = JSON.parse(await readFile('/tmp/pkg-check/package/package.json', 'utf8'));
          if (packed.name !== process.env.PACKAGE_NAME) {
            throw new Error(`Packed name mismatch: ${packed.name}`);
          }
          if (packed.version !== process.env.PACKAGE_VERSION) {
            throw new Error(`Packed version mismatch: ${packed.version}`);
          }

          const source = JSON.parse(
            await readFile(`packages/${process.env.PACKAGE_DIR}/package.json`, 'utf8'),
          );
          const sourceShared = source.dependencies?.['@f3d1/llmkit-shared'];
          const shared = packed.dependencies?.['@f3d1/llmkit-shared'];
          if (sourceShared) {
            const expected = JSON.parse(await readFile('packages/shared/package.json', 'utf8')).version;
            if (shared !== expected) {
              throw new Error(`Packed shared dependency mismatch: ${shared} != ${expected}`);
            }
            await assertPublishedVersion('npm', '@f3d1/llmkit-shared', expected);
          }

          if (process.env.PACKAGE_DIR === 'mcp-server') {
            const [sourceMcpb, packedMcpb] = await Promise.all([
              readFile('packages/mcp-server/mcp-server.mcpb'),
              readFile('/tmp/pkg-check/package/mcp-server.mcpb'),
            ]);
            const sha256 = (contents) => createHash('sha256').update(contents).digest('hex');
            if (sha256(sourceMcpb) !== sha256(packedMcpb)) {
              throw new Error('Packed MCPB does not match the verified source artifact.');
            }
          }
          NODE

      - name: attest artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/pkg/*.tgz

      - name: attest MCPB artifact
        if: inputs.package == 'mcp-server'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/mcp-server/mcp-server.mcpb

      - name: publish with provenance
        run: npm publish /tmp/pkg/*.tgz --provenance --access public

      - name: retain MCPB convenience artifact
        if: inputs.package == 'mcp-server'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmkit-mcp-server-${{ steps.release.outputs.version }}-mcpb
          path: packages/mcp-server/mcp-server.mcpb
          if-no-files-found: error
          retention-days: 30

      - name: alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=npm publish FAILED for ${{ inputs.package }}" > /dev/null
