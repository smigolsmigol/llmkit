name: Health Check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      check_runtime:
        description: Check the proxy and dashboard recovery surfaces
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECK_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.check_runtime == true }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout health contracts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Check published artifacts and requested runtime surfaces
        shell: bash
        run: |
          FAILURES=""
          RESPONSE_BODY=$(mktemp)
          trap 'rm -f "$RESPONSE_BODY"' EXIT

          record_failure() {
            FAILURES="${FAILURES}$1%0A"
          }

          request_with_retries() {
            local url="$1" max_time="$2" follow_redirects="$3"
            local attempt status curl_exit
            local -a redirect_args=()
            if [ "$follow_redirects" = "true" ]; then
              redirect_args=(-L)
            fi

            for attempt in 1 2 3; do
              : > "$RESPONSE_BODY"
              if status=$(curl -sS "${redirect_args[@]}" -o "$RESPONSE_BODY" -w '%{http_code}' \
                --max-time "$max_time" "$url"); then
                curl_exit=0
              else
                curl_exit=$?
              fi
              if [ "$curl_exit" -ne 0 ]; then
                status="000"
              fi
              case "$status" in
                000|408|429|500|502|503|504) ;;
                *) break ;;
              esac
            done
            printf '%s' "$status"
          }

          check_http() {
            local name="$1" url="$2"
            local status
            status=$(curl -sSL -o /dev/null -w '%{http_code}' \
              --max-time 15 --retry 2 --retry-all-errors "$url" || true)
            if [ "$status" = "000" ] || [ -z "$status" ]; then
              record_failure "${name}: connection failed"
            elif [ "$status" != "200" ]; then
              record_failure "${name}: got ${status}, expected 200"
            fi
          }

          check_http_contains() {
            local name="$1" url="$2" expected="$3"
            local status body
            status=$(request_with_retries "$url" 15 true)
            body=$(<"$RESPONSE_BODY")
            if [ "$status" = "000" ] || [ -z "$status" ]; then
              record_failure "${name}: connection failed"
            elif [ "$status" != "200" ]; then
              record_failure "${name}: got ${status}, expected 200"
            elif ! printf '%s' "$body" | grep -Fq "$expected"; then
              record_failure "${name}: missing expected recovery marker"
            fi
          }

          check_npm() {
            local pkg="$1" manifest="$2"
            local ver expected
            expected=$(node -p "require('./${manifest}').version" 2>/dev/null || true)
            if [ -z "$expected" ]; then
              record_failure "npm ${pkg}: unable to read repository version"
              return
            fi
            ver=$(npm view "$pkg" version --fetch-retries=2 --fetch-timeout=15000 2>/dev/null || true)
            if [ -z "$ver" ]; then
              record_failure "npm ${pkg}: not found on registry"
            elif [ "$ver" != "$expected" ]; then
              record_failure "npm ${pkg}: registry ${ver} != repo ${expected}"
            fi
          }

          check_mcp_registry_version() {
            local server_name="$1" pkg="$2" url="$3"
            local npm_version status body result
            npm_version=$(npm view "$pkg" version --fetch-retries=2 --fetch-timeout=15000 2>/dev/null || true)
            if [ -z "$npm_version" ] || echo "$npm_version" | grep -qiE '(^npm error|E404|not found)'; then
              record_failure "MCP Registry: unable to resolve npm ${pkg} version"
              return
            fi

            status=$(request_with_retries "$url" 15 false)
            body=$(<"$RESPONSE_BODY")
            if [ "$status" = "000" ] || [ -z "$status" ]; then
              record_failure "MCP Registry: connection failed"
              return
            fi
            if [ "$status" != "200" ]; then
              record_failure "MCP Registry: got ${status}, expected 200"
              return
            fi

            if ! result=$(printf '%s' "$body" | node scripts/check-mcp-registry-version.mjs \
              "$npm_version" "$server_name" "$pkg" 2>&1); then
              record_failure "MCP Registry: ${result}"
            else
              echo "$result"
            fi
          }

          check_pypi() {
            local pkg="$1" pyproject="$2"
            local expected status body actual
            expected=$(node -e "const fs=require('fs');const s=fs.readFileSync(process.argv[1],'utf8');const m=s.match(/^version = \"([^\"]+)\"$/m);if(m)process.stdout.write(m[1]);" "$pyproject" 2>/dev/null || true)
            if [ -z "$expected" ]; then
              record_failure "PyPI ${pkg}: unable to read repository version"
              return
            fi
            status=$(request_with_retries "https://pypi.org/pypi/${pkg}/json" 10 false)
            body=$(<"$RESPONSE_BODY")
            if [ "$status" != "200" ]; then
              record_failure "PyPI ${pkg}: got ${status:-no response}, expected 200"
              return
            fi
            actual=$(printf '%s' "$body" | node -e "const fs=require('fs');try{const p=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(p.info?.version??'')}catch{}" 2>/dev/null || true)
            if [ -z "$actual" ]; then
              record_failure "PyPI ${pkg}: response did not contain a version"
            elif [ "$actual" != "$expected" ]; then
              record_failure "PyPI ${pkg}: registry ${actual} != repo ${expected}"
            fi
          }

          check_pricing_contract() {
            local name="$1" url="$2" expected_status="$3"
            shift 3
            local status body result
            status=$(request_with_retries "$url" 15 false)
            body=$(<"$RESPONSE_BODY")
            if [ "$status" = "000" ] || [ -z "$status" ]; then
              record_failure "${name}: connection failed"
            elif [ "$status" != "$expected_status" ]; then
              record_failure "${name}: got ${status}, expected ${expected_status}"
            elif ! result=$(printf '%s' "$body" | node scripts/check-public-pricing-contract.mjs "$@" 2>&1); then
              record_failure "${name}: ${result}"
            else
              echo "$result"
            fi
          }

          # Stable distribution surfaces remain scheduled.
          check_npm "@f3d1/llmkit-sdk" "packages/sdk/package.json"
          check_npm "@f3d1/llmkit-cli" "packages/cli/package.json"
          check_npm "@f3d1/llmkit-mcp-server" "packages/mcp-server/package.json"
          check_npm "@f3d1/llmkit-ai-sdk-provider" "packages/ai-sdk-provider/package.json"
          check_npm "@f3d1/llmkit-shared" "packages/shared/package.json"
          check_pypi "llmkit-sdk" "packages/python-sdk/pyproject.toml"
          check_http "Glama" "https://glama.ai/mcp/servers/smigolsmigol-llmkit"
          check_mcp_registry_version "io.github.smigolsmigol/llmkit" \
            "@f3d1/llmkit-mcp-server" \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.smigolsmigol%2Fllmkit/versions/latest"

          # Parked or private runtime surfaces are checked only on an explicit manual run.
          if [ "$CHECK_RUNTIME" = "true" ]; then
            check_http "Proxy" "https://api.llmkit.sh/health"
            check_pricing_contract "Proxy pricing comparison" \
              "https://api.llmkit.sh/v1/pricing/compare?mode=text-token&models=anthropic%2Fclaude-sonnet-4-6%2Copenai%2Fgpt-4o&input=1000&output=500&cacheRead=0&cacheWrite=0" \
              "200" comparison "anthropic/claude-sonnet-4-6,openai/gpt-4o" 1000 500 0 0
            check_pricing_contract "Proxy pricing rejection" \
              "https://api.llmkit.sh/v1/pricing/compare?mode=garbage&models=openai%2Fgpt-4o&input=1&output=0&cacheRead=0&cacheWrite=0" \
              "400" error "INVALID_PRICING_QUERY" "mode"
            check_http_contains "Dashboard recovery" \
              "https://llmkit.sh/service-restoring" "Controlled restoration"
            check_http_contains "Homepage recovery disclosure" \
              "https://llmkit.sh/" "Hosted accounts are temporarily unavailable"
            check_http_contains "Docs recovery disclosure" \
              "https://llmkit.sh/docs" \
              "Hosted account creation and API-key management are temporarily unavailable"
          else
            echo "Runtime checks skipped. Use workflow_dispatch with check_runtime=true."
          fi

          if [ -n "$FAILURES" ]; then
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            TEXT="<b>Health Check FAILED</b> ${DATE}%0A%0A${FAILURES}"
            echo "::error::Health check failures detected"
            printf '%b\n' "${FAILURES//%0A/\\n}"
            printf '### Health Check failures\n\n%b\n' \
              "${FAILURES//%0A/\\n}" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              curl -sS --max-time 15 -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT}" \
                -d parse_mode="HTML" \
                -d text="$TEXT" >/dev/null || true
            fi

            exit 1
          fi

          echo "Published artifact checks passed." >> "$GITHUB_STEP_SUMMARY"
