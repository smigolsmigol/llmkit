name: Health Check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      check_runtime:
        description: Check the proxy and dashboard recovery surfaces
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECK_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.check_runtime == true }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check published artifacts and requested runtime surfaces
        shell: bash
        run: |
          FAILURES=""

          record_failure() {
            FAILURES="${FAILURES}$1%0A"
          }

          check_http() {
            local name="$1" url="$2"
            local status
            status=$(curl -sSL -o /dev/null -w '%{http_code}' \
              --max-time 15 --retry 2 --retry-all-errors "$url" || true)
            if [ "$status" = "000" ] || [ -z "$status" ]; then
              record_failure "${name}: connection failed"
            elif [ "$status" != "200" ]; then
              record_failure "${name}: got ${status}, expected 200"
            fi
          }

          check_http_contains() {
            local name="$1" url="$2" expected="$3"
            local response status body
            response=$(curl -sSL -w '\n%{http_code}' \
              --max-time 15 --retry 2 --retry-all-errors "$url" || true)
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$status" = "000" ] || [ -z "$status" ]; then
              record_failure "${name}: connection failed"
            elif [ "$status" != "200" ]; then
              record_failure "${name}: got ${status}, expected 200"
            elif ! printf '%s' "$body" | grep -Fq "$expected"; then
              record_failure "${name}: missing expected recovery marker"
            fi
          }

          check_npm() {
            local pkg="$1"
            local ver
            ver=$(npm view "$pkg" version --fetch-retries=2 --fetch-timeout=15000 2>&1 || true)
            if [ -z "$ver" ] || echo "$ver" | grep -qiE '(^npm error|E404|not found)'; then
              record_failure "npm ${pkg}: not found on registry"
            fi
          }

          check_pypi() {
            local pkg="$1"
            local status
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 10 --retry 2 --retry-all-errors \
              "https://pypi.org/pypi/${pkg}/json" || true)
            if [ "$status" != "200" ]; then
              record_failure "PyPI ${pkg}: got ${status:-no response}, expected 200"
            fi
          }

          # Stable distribution surfaces remain scheduled.
          check_npm "@f3d1/llmkit-sdk"
          check_npm "@f3d1/llmkit-cli"
          check_npm "@f3d1/llmkit-mcp-server"
          check_npm "@f3d1/llmkit-ai-sdk-provider"
          check_npm "@f3d1/llmkit-shared"
          check_pypi "llmkit-sdk"
          check_http "Glama" "https://glama.ai/mcp/servers/smigolsmigol-llmkit"
          check_http "MCP Registry" \
            "https://registry.modelcontextprotocol.io/v0/servers/io.github.smigolsmigol%2Fllmkit/versions"

          # Parked or private runtime surfaces are checked only on an explicit manual run.
          if [ "$CHECK_RUNTIME" = "true" ]; then
            check_http "Proxy" "https://api.llmkit.sh/health"
            check_http_contains "Dashboard recovery" \
              "https://llmkit.sh/service-restoring" "Controlled restoration"
            check_http_contains "Homepage recovery disclosure" \
              "https://llmkit.sh/" "Hosted accounts are temporarily unavailable"
            check_http_contains "Docs recovery disclosure" \
              "https://llmkit.sh/docs" \
              "Hosted account creation and API-key management are temporarily unavailable"
          else
            echo "Runtime checks skipped. Use workflow_dispatch with check_runtime=true."
          fi

          if [ -n "$FAILURES" ]; then
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            TEXT="<b>Health Check FAILED</b> ${DATE}%0A%0A${FAILURES}"
            echo "::error::Health check failures detected"
            printf '%b\n' "${FAILURES//%0A/\\n}"
            printf '### Health Check failures\n\n%b\n' \
              "${FAILURES//%0A/\\n}" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              curl -sS --max-time 15 -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT}" \
                -d parse_mode="HTML" \
                -d text="$TEXT" >/dev/null || true
            fi

            exit 1
          fi

          echo "Published artifact checks passed." >> "$GITHUB_STEP_SUMMARY"
