name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full commit SHA this publication is authorized to release'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: verify expected commit
        run: >-
          node ../../scripts/assert-unpublished-version.mjs expected-sha
          "${{ inputs.expected_sha }}"
          "${{ github.sha }}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: install build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement ../../requirements-ci.txt

      - name: refuse an existing registry version
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          node ../../scripts/assert-unpublished-version.mjs pypi llmkit-sdk "$VERSION"

      - name: test declared Python floor
        run: python -m pytest

      - name: build
        run: python -m build --no-isolation

      - name: install and verify wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import llmkit, tomllib; expected=tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert llmkit.__version__ == expected, (llmkit.__version__, expected)"

      - name: attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/python-sdk/dist/*

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python-sdk/dist/

      - name: alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=PyPI publish FAILED for llmkit-sdk" > /dev/null
