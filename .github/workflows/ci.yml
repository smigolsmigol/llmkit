name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type production:api.llmkit.sh only when authorizing the exact production target"
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: quality-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: enable exact package manager
        run: corepack enable

      - name: install workspace
        run: corepack pnpm@9.15.4 install --frozen-lockfile

      - name: bootstrap pinned quality tools
        run: corepack pnpm@9.15.4 quality:bootstrap:all

      - name: optional private-pattern boundary
        shell: bash
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          if [ -z "$PRIVATE_PATTERNS" ]; then
            echo "PRIVATE_PATTERNS is not configured; repository secret gates remain mandatory."
            exit 0
          fi

          found=0
          IFS=',' read -r -a patterns <<< "$PRIVATE_PATTERNS"
          for pattern in "${patterns[@]}"; do
            if git grep -Ili -e "$pattern" -- . \
              ':(exclude).github/workflows/**' \
              ':(exclude).github/hooks/**'; then
              echo "::error::A configured private pattern was found in tracked files."
              found=1
            fi
          done
          test "$found" -eq 0

      - name: start local database proof stack
        run: corepack pnpm@9.15.4 db:start

      - name: run the local pre-PR contract
        run: corepack pnpm@9.15.4 quality:pr

      - name: stop local database proof stack
        if: always()
        run: corepack pnpm@9.15.4 db:stop

      - name: retain coverage reports for isolated upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codecov-reports-${{ github.sha }}
          path: |
            .cache/python-coverage.xml
            packages/dashboard/coverage/dashboard/lcov.info
            packages/proxy/coverage/budget-falsifier/lcov.info
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-observability:
    name: coverage-observability
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codecov-reports-${{ github.sha }}
          path: coverage-reports

      - name: upload dashboard coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage-reports/packages/dashboard/coverage/dashboard/lcov.info
          flags: dashboard
          root_dir: packages/dashboard
          use_oidc: true
          version: v11.3.1

      - name: upload proxy coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage-reports/packages/proxy/coverage/budget-falsifier/lcov.info
          flags: proxy
          root_dir: packages/proxy
          use_oidc: true
          version: v11.3.1

      - name: upload Python SDK coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage-reports/.cache/python-coverage.xml
          flags: python-sdk
          root_dir: packages/python-sdk
          use_oidc: true
          version: v11.3.1

  dashboard-reproducibility:
    name: dashboard-reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: build the dashboard artifact twice from clean layers
        run: node scripts/run-dashboard-reproducibility.mjs

      - name: retain dashboard reproducibility failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-reproducibility-${{ github.sha }}
          path: |
            audits/llmkit-dashboard-reproducibility.json
            audits/llmkit-dashboard-reproducibility-failure/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  python-floor:
    name: python-3.11-floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: install declared floor
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements-ci.txt
          python -m pip check

      - name: prove declared floor
        working-directory: packages/python-sdk
        env:
          PYTHONPATH: src
        run: |
          python -m build --no-isolation
          python -m compileall -q src
          python -m pytest tests
          python fuzz/run_local.py

  scorecard-supply-chain:
    name: scorecard-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: require pinned dependencies and zero vulnerabilities
        run: node scripts/assert-scorecard-supply-chain.mjs results.json

  osv:
    name: osv-zero-vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: scan repository manifests
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=results.json
            -r
            ./

      - name: require zero known vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=true
            --fail-on-vuln=true

  deploy:
    name: deploy-production-api
    needs: [quality, dashboard-reproducibility, python-floor, scorecard-supply-chain, osv]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_production == 'production:api.llmkit.sh'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: install exact workspace
        run: |
          corepack enable
          corepack pnpm@9.15.4 install --frozen-lockfile

      - name: build shared package
        run: corepack pnpm@9.15.4 --filter @f3d1/llmkit-shared build

      - name: deploy exact production API target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLMKIT_DEPLOY_APPROVED: production:api.llmkit.sh
        run: >-
          node scripts/run-worker-deploy.mjs
          --target production
          --confirm production:api.llmkit.sh

      - name: notify successful deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          first_line=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -d '<>&')
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=<b>Deployed to Cloudflare Workers</b>%0A%0A<code>${first_line}</code>%0Aby ${{ github.actor }}"

  post-deploy-verify:
    name: verify-production-api
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: verify API health
        shell: bash
        run: |
          headers_file=$(mktemp)
          trap 'rm -f "$headers_file"' EXIT
          for attempt in 1 2 3; do
            : > "$headers_file"
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --dump-header "$headers_file" \
              --max-time 30 "https://api.llmkit.sh/health" || true)
            worker_version=$(tr -d '\r' < "$headers_file" \
              | awk -F': ' 'tolower($1) == "x-llmkit-worker-version" { print $2; exit }')
            if [ "$status" = "200" ] \
              && [[ "$worker_version" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "Production API health: $status; x-llmkit-worker-version: $worker_version"
              exit 0
            fi
            echo "Attempt ${attempt}: health returned ${status}; worker version '${worker_version:-missing}'."
            sleep 10
          done
          echo "::error::Production API health or immutable Worker version receipt failed after three attempts."
          exit 1

  notify-failure:
    name: notify-ci-failure
    needs: [quality, dashboard-reproducibility, python-floor, scorecard-supply-chain, osv, deploy, post-deploy-verify]
    if: >-
      always() &&
      contains(needs.*.result, 'failure') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: notify failure
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram failure alert is not configured; skipping delivery."
            exit 0
          fi
          first_line=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -d '<>&')
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=<b>CI failed</b>%0A%0A<code>${first_line}</code>%0Aby ${{ github.actor }}%0A%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"
