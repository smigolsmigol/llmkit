name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type production:api.llmkit.sh only when authorizing the exact production target"
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: quality-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: enable exact package manager
        run: corepack enable

      - name: install workspace
        run: corepack pnpm@9.15.4 install --frozen-lockfile

      - name: bootstrap pinned quality tools
        run: corepack pnpm@9.15.4 quality:bootstrap:all

      - name: optional private-pattern boundary
        shell: bash
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          if [ -z "$PRIVATE_PATTERNS" ]; then
            echo "PRIVATE_PATTERNS is not configured; repository secret gates remain mandatory."
            exit 0
          fi

          found=0
          IFS=',' read -r -a patterns <<< "$PRIVATE_PATTERNS"
          for pattern in "${patterns[@]}"; do
            if git grep -Ili -e "$pattern" -- . \
              ':(exclude).github/workflows/**' \
              ':(exclude).github/hooks/**'; then
              echo "::error::A configured private pattern was found in tracked files."
              found=1
            fi
          done
          test "$found" -eq 0

      - name: run the local pre-PR contract
        run: corepack pnpm@9.15.4 quality:pr

  python-floor:
    name: python-3.11-floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: install declared floor
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements-ci.txt
          python -m pip check

      - name: prove declared floor
        working-directory: packages/python-sdk
        env:
          PYTHONPATH: src
        run: |
          python -m build --no-isolation
          python -m compileall -q src
          python -m pytest tests
          python fuzz/run_local.py

  scorecard-supply-chain:
    name: scorecard-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.json
          results_format: json
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: require pinned dependencies and zero vulnerabilities
        run: node scripts/assert-scorecard-supply-chain.mjs results.json

  osv:
    name: osv-zero-vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: scan repository manifests
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=results.json
            -r
            ./

      - name: require zero known vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=true
            --fail-on-vuln=true

  deploy:
    name: deploy-production-api
    needs: [quality, python-floor, scorecard-supply-chain, osv]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_production == 'production:api.llmkit.sh'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: install exact workspace
        run: |
          corepack enable
          corepack pnpm@9.15.4 install --frozen-lockfile

      - name: build shared package
        run: corepack pnpm@9.15.4 --filter @f3d1/llmkit-shared build

      - name: deploy exact production API target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLMKIT_DEPLOY_APPROVED: production:api.llmkit.sh
        run: >-
          node scripts/run-worker-deploy.mjs
          --target production
          --confirm production:api.llmkit.sh

      - name: notify successful deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          first_line=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -d '<>&')
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=<b>Deployed to Cloudflare Workers</b>%0A%0A<code>${first_line}</code>%0Aby ${{ github.actor }}"

  post-deploy-verify:
    name: verify-production-api
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: verify API health
        shell: bash
        run: |
          for attempt in 1 2 3; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 30 "https://api.llmkit.sh/health")
            if [ "$status" -eq 200 ]; then
              echo "Production API health: $status"
              exit 0
            fi
            echo "Attempt ${attempt}: health returned ${status}."
            sleep 10
          done
          echo "::error::Production API health failed after three attempts."
          exit 1

  notify-failure:
    name: notify-ci-failure
    needs: [quality, python-floor, scorecard-supply-chain, osv, deploy, post-deploy-verify]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: notify failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          first_line=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -d '<>&')
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=<b>CI failed</b>%0A%0A<code>${first_line}</code>%0Aby ${{ github.actor }}%0A%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"
